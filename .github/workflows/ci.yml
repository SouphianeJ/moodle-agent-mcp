name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned by commit SHA (the tag in the comment); each job asks only for what it needs.
permissions: {}

jobs:
  skills:
    name: Skills and manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test the skill checker
        run: npm test
      - name: Check skills against the Agent Skills specification
        run: node scripts/check-skills.mjs
      - name: Check the French text of the scenarios
        run: node scripts/check-i18n.mjs
      - name: Build the skill zips
        run: scripts/build-skill-zips.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-zips
          path: dist/skills/
          retention-days: 14

  site:
    name: Site (lint, typecheck, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: The export has every page, in both languages
        run: |
          for lang in fr en; do
            for page in "" examples/ scenarios/ security/ install/ skills/ faq/ legal/ missing/; do
              test -f "out/$lang/${page}index.html" || { echo "missing out/$lang/${page}index.html"; exit 1; }
            done
          done
      - name: Every inline script has its hash in the CSP of deploy/Caddyfile.site
        working-directory: .
        run: node scripts/csp-hashes.mjs
      - name: No external resource in the pages
        run: |
          if grep -rhoE '(src|href)="https?://[^"]+"' out --include=*.html | grep -E '^src=' ; then
            echo "external resource loaded by a page"; exit 1
          fi
          if grep -rhoE '@import url\(https?:|url\(https?://' out --include=*.css ; then
            echo "external resource in CSS"; exit 1
          fi
