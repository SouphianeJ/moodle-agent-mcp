name: Release

# On a tag v*, build one zip per skill (the skills only: the plugin itself is not published here) and attach them, with their SHA-256 sums, to the GitHub release of the tag.
# The site links to releases/latest/download/<skill>.zip.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)attach the zips to
        required: true

# Actions are pinned by commit SHA (the tag in the comment); only this job may write, to the release.
permissions: {}

jobs:
  skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Build from the tag itself, also when the workflow is started by hand from another branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/check-skills.mjs
      - run: scripts/build-skill-zips.sh
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Skills of local_mcpcourse, one zip per skill. Check with: sha256sum -c SHA256SUMS"
          gh release upload "$TAG" dist/skills/*.zip dist/skills/SHA256SUMS --clobber
