name: Release

# On a tag v*, build one zip per skill and attach them, with their SHA-256 sums, to the GitHub release of the tag.
# The site links to releases/latest/download/<skill>.zip.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)attach the zips to
        required: true

permissions:
  contents: write

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-skills.mjs
      - run: scripts/build-skill-zips.sh
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Skills of local_mcpcourse, one zip per skill. Check with: sha256sum -c SHA256SUMS"
          gh release upload "$TAG" dist/skills/*.zip dist/skills/SHA256SUMS --clobber
